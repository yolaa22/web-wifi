<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cantika Data Prima</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #3b82f6;
            --light-blue: #eff6ff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --error-color: #ef4444;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--light-blue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.05) 0%, transparent 20%);
            z-index: -1;
        }

        /* Notification styling */
        .notification {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 16px 24px;
            background: white;
            color: var(--text-dark);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: none;
            animation: slideInRight 0.3s ease-out;
            border-left: 4px solid var(--success-color);
            max-width: 350px;
            font-weight: 500;
            align-items: center;
            gap: 12px;
        }

        .notification.error {
            border-left-color: var(--error-color);
        }

        .notification i {
            font-size: 20px;
        }

        .notification.success i {
            color: var(--success-color);
        }

        .notification.error i {
            color: var(--error-color);
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Login container */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login card */
        .login-card {
            padding: 50px 40px;
        }

        /* Login header */
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo img {
            max-width: 180px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .logo:hover img {
            transform: scale(1.05);
        }

        .login-header h1 {
            color: var(--text-dark);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-light);
            font-size: 15px;
            line-height: 1.5;
            max-width: 300px;
            margin: 0 auto;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i {
            position: absolute;
            left: 16px;
            color: var(--text-light);
            font-size: 16px;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background-color: white;
            color: var(--text-dark);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        /* Button styling */
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Footer styling */
        .login-footer {
            margin-top: 30px;
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .login-footer a:hover {
            background-color: rgba(37, 99, 235, 0.05);
            color: var(--primary-dark);
            text-decoration: none;
        }

        .login-footer i {
            margin-right: 8px;
            font-size: 14px;
        }

        /* Additional info panel */
        .info-panel {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 30px;
            color: white;
            text-align: center;
            display: none;
        }

        .info-panel h3 {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .info-panel p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Responsive design */
        @media (min-width: 768px) {
            .login-container {
                display: flex;
                max-width: 900px;
                min-height: 550px;
            }
            
            .login-card {
                flex: 1;
                padding: 60px 50px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .info-panel {
                display: block;
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 60px 40px;
            }
            
            .info-panel h3 {
                font-size: 24px;
            }
            
            .info-panel p {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 30px;
            }
            
            .login-header h1 {
                font-size: 24px;
            }
            
            .logo img {
                max-width: 150px;
            }
        }

        /* Animation for error state */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Loading spinner */
        .fa-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Security badge */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            color: var(--text-light);
            font-size: 13px;
        }

        .security-badge i {
            color: var(--success-color);
        }
    </style>
</head>
<body class="admin-login-page">
    <!-- Notification container -->
    <div id="notification" class="notification">
        <i class="fas fa-check-circle"></i>
        <span class="notification-text"></span>
    </div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
            <div class="logo">
                <img src="../images/logo2.png" alt="Logo WiFiNet">
                <!-- Atau tambahkan class khusus jika perlu -->
                <!-- <img src="images/logo.png" alt="Logo WiFiNet" class="large-logo"> -->
            </div>
                <p>Masuk ke dashboard administrasi Cantika Data Prima</p>
            </div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" required placeholder="Masukkan username admin">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Masukkan password">
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i> Masuk ke Dashboard
                </button>
                
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    <span>Sistem terenkripsi dengan keamanan tinggi</span>
                </div>
                
                <div class="login-footer">
                    <a href="../index.html">
                        <i class="fas fa-arrow-left"></i> Kembali ke Beranda
                    </a>
                </div>
            </form>
        </div>
        
        <!-- Info panel untuk desktop -->
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('adminLoginForm');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const notification = document.getElementById('notification');
            const notificationText = document.querySelector('.notification-text');
            const notificationIcon = notification.querySelector('i');
            
            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle eye icon
                const eyeIcon = this.querySelector('i');
                eyeIcon.classList.toggle('fa-eye');
                eyeIcon.classList.toggle('fa-eye-slash');
            });
            
            // Show notification function
            function showNotification(message, isError = false) {
                notificationText.textContent = message;
                notification.className = 'notification';
                notificationIcon.className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
                
                if (isError) {
                    notification.classList.add('error');
                    notificationIcon.classList.add('error');
                } else {
                    notification.classList.add('success');
                    notificationIcon.classList.add('success');
                }
                
                notification.style.display = 'flex';
                
                // Hide notification after 4 seconds
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 4000);
            }
            
            // Form submission handler
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                // Simple validation
                if (!username || !password) {
                    showNotification('Harap isi username dan password!', true);
                    return;
                }
                
                // Show loading state on button
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
                submitBtn.disabled = true;
                
                // Simulate API call delay
                setTimeout(() => {
                    // Simulasi login (dalam implementasi real, ini akan mengirim ke server)
                    if (username === 'admin' && password === 'admin123') {
                        showNotification('Login berhasil! Mengarahkan ke dashboard...');
                        
                        // Add success animation to form
                        loginForm.classList.add('success');
                        
                        // Redirect after a short delay
                        setTimeout(() => {
                            window.location.href = '../admin-dashboard.html';
                        }, 1500);
                    } else {
                        showNotification('Username atau password salah! Coba lagi.', true);
                        
                        // Reset button state
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                        
                        // Shake animation for wrong credentials
                        loginForm.classList.add('shake');
                        setTimeout(() => {
                            loginForm.classList.remove('shake');
                        }, 500);
                    }
                }, 1000);
            });
            
            // Auto focus on username field
            document.getElementById('username').focus();
            
            // Add enter key support
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
